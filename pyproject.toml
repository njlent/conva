[project]
name = "conva"
version = "0.1.0"
description = "ffmpeg-style image and image sequence converter with OCIO/ACES color management"
readme = "README.md"
authors = [
    { name = "noeljustin", email = "noel@mimikry.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencolorio>=2.6.0",
    "openimageio>=3.2.1.3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "rawpy>=0.27.1",
]

[project.scripts]
conva = "conva:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
